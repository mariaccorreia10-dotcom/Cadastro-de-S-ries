<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Séries</title>

    <style>
        body {
            font-family: Arial;
            background: #dcebd8;
            text-align: center;
            padding: 30px;
        }

        .caixa {
            background: #fffaf0;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 15px #999;
        }

        h1 {
            color: #8b4a62;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 7px;
            border: 1px solid #b58b9a;
            border-radius: 8px;
        }

        button {
            padding: 10px 14px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #8b4a62;
            color: white;
        }

        button:hover {
            background: #667b55;
        }
    </style>
</head>

<body>

<div class="caixa">

    <h1>Cadastro de Séries</h1>

    <input type="text" placeholder="Ex: Anne with an E">
    <input type="text" placeholder="Ex: Netflix">
    <input type="text" placeholder="Ex: Moira Walley-Beckett">
    <input type="number" placeholder="Ex: 3">
    <input type="number" placeholder="Ex: 2017">
    <input type="text" placeholder="Ex: Anne, Gilbert e Diana">

    <br>

    <button>Salvar</button>
    <button>Limpar</button>
    <button>Editar</button>
    <button>Consultar</button>

</div>

</body>
</html>
