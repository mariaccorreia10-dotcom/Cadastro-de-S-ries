<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Séries</title>

    <style>
        body {
            font-family: Arial;
            background: #dcebd8;
            text-align: center;
            padding: 30px;
        }

        .caixa {
            background: #fffaf0;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 0 15px #999;
        }

        h1 {
            color: #8b4a62;
        }

        p {
            color: #667b55;
            font-style: italic;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 7px;
            border: 1px solid #b58b9a;
            border-radius: 8px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 10px;
            background: #8b4a62;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #667b55;
        }
    </style>
</head>

<body>

<div class="caixa">

    <h1>Cadastro de Séries</h1>
    <p>“Grandes coisas começam com pequenos sonhos.”</p>

    <input type="text" placeholder="Nome da série">
    <input type="text" placeholder="Streaming">
    <input type="text" placeholder="Autor ou criador">
    <input type="number" placeholder="Quantidade de temporadas">
    <input type="number" placeholder="Ano de criação">
    <input type="text" placeholder="Três principais personagens">

    <br>

    <button>Salvar</button>
    <button>Limpar</button>
    <button>Editar</button>
    <button>Consultar</button>

</div>

</body>
</html>
